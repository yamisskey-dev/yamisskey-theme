<style id="theme-color">
  :root {
    /* DXM Theme Colors */
    --theme-color: #966BFF;
    --background-color: #131026;
    --text-color: #C2CBE0;
    --accent-color: #A374FF;
    --link-color: #A374FF;
    --button-bg-color: rgba(163, 116, 255, 0.2);
    --button-hover-bg-color: rgba(163, 116, 255, 0.3);
    --input-border-color: rgba(163, 116, 255, 0.25);
    --header-text-color: #FFFFFF;

    /* Extended DXM Colors */
    --mk-bg: #131026;
    --mk-fg: #C2CBE0;
    --mk-panel: rgba(16, 11, 34, 0.86);
    --mk-popup: rgba(16, 11, 34, 0.95);
    --mk-navBg: rgba(23, 15, 42, 0.92);
    --mk-accent: #A374FF;
    --mk-mention: #D655D6;
    --mk-divider: rgba(163, 116, 255, 0.25);
    --mk-accentedBg: rgba(163, 116, 255, 0.15);
    --mk-panelHeaderBg: rgba(185, 54, 185, 0.7);
    --mk-listItemHoverBg: rgba(255, 255, 255, 0.09);
    --mk-shadow: rgba(0, 0, 0, 0.5);
    --mk-success: rgba(121, 255, 194, 0.94);
    --mk-warn: rgba(255, 175, 99, 0.96);
    --mk-error: rgba(255, 102, 194, 0.96);
    --mk-buttonGradient: linear-gradient(135deg, #B32DB6, #966BFF, #4B38A5);
  }

  /* === NAVBAR / JUMBOTRON === */
  .navbar, .jumbotron {
    background: var(--mk-panelHeaderBg) !important;
    color: var(--header-text-color) !important;
  }

  .navbar a, .jumbotron a, .navbar-brand, .navbar-nav .nav-link {
    color: var(--header-text-color) !important;
  }

  .navbar-nav .nav-link:hover {
    opacity: 0.8;
  }

  /* === BODY === */
  body {
    background-color: var(--mk-bg) !important;
    color: var(--mk-fg) !important;
  }

  /* === LINKS === */
  a {
    color: var(--mk-accent) !important;
  }

  a:hover {
    color: var(--mk-mention) !important;
  }

  /* === BUTTONS === */
  .btn-primary {
    background: var(--mk-buttonGradient) !important;
    border: none !important;
    color: #FFFFFF !important;
  }

  .btn-primary:hover {
    opacity: 0.85;
  }

  .btn-secondary, .btn-outline-secondary {
    background-color: var(--button-bg-color) !important;
    border-color: var(--input-border-color) !important;
    color: var(--mk-fg) !important;
  }

  .btn-secondary:hover, .btn-outline-secondary:hover {
    background-color: var(--button-hover-bg-color) !important;
  }

  .btn-success {
    background-color: var(--mk-success) !important;
    border: none !important;
    color: #0A1F15 !important;
  }

  .btn-danger {
    background-color: var(--mk-error) !important;
    border: none !important;
    color: #2B0814 !important;
  }

  .btn-warning {
    background-color: var(--mk-warn) !important;
    border: none !important;
    color: #1A0F00 !important;
  }

  /* === CARDS === */
  .card {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
    box-shadow: 0 2px 8px var(--mk-shadow) !important;
  }

  .card-header {
    background-color: var(--mk-panelHeaderBg) !important;
    border-bottom: 1px solid var(--mk-divider) !important;
    color: var(--header-text-color) !important;
  }

  .card-body {
    color: var(--mk-fg) !important;
  }

  /* === FORMS === */
  .form-control, input, textarea, select {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--input-border-color) !important;
    color: var(--mk-fg) !important;
  }

  .form-control:focus, input:focus, textarea:focus, select:focus {
    border-color: var(--mk-accent) !important;
    box-shadow: 0 0 0 2px var(--mk-accentedBg) !important;
    outline: none !important;
  }

  .form-control::placeholder, input::placeholder {
    color: rgba(194, 203, 224, 0.65) !important;
  }

  /* === TABLES === */
  .table {
    color: var(--mk-fg) !important;
  }

  .table thead th {
    background-color: var(--mk-accentedBg) !important;
    border-bottom: 1px solid var(--mk-divider) !important;
    color: var(--mk-fg) !important;
  }

  .table tbody tr {
    border-bottom: 1px solid var(--mk-divider) !important;
  }

  .table tbody tr:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }

  .table-striped tbody tr:nth-of-type(odd) {
    background-color: rgba(163, 116, 255, 0.05) !important;
  }

  /* === MODALS === */
  .modal-content {
    background-color: var(--mk-popup) !important;
    border: 1px solid var(--mk-divider) !important;
    box-shadow: 0 4px 16px var(--mk-shadow) !important;
  }

  .modal-header {
    background-color: var(--mk-panelHeaderBg) !important;
    border-bottom: 1px solid var(--mk-divider) !important;
    color: var(--header-text-color) !important;
  }

  .modal-footer {
    border-top: 1px solid var(--mk-divider) !important;
  }

  .modal-backdrop {
    background-color: rgba(12, 9, 26, 0.8) !important;
  }

  /* === CHALLENGES === */
  .challenge-button, .challenge-card {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
    color: var(--mk-fg) !important;
  }

  .challenge-button:hover, .challenge-card:hover {
    background-color: var(--mk-listItemHoverBg) !important;
    border-color: var(--mk-accent) !important;
  }

  .challenge-button.solved, .challenge-card.solved {
    border-color: var(--mk-success) !important;
    background-color: rgba(121, 255, 194, 0.1) !important;
  }

  /* === BADGES === */
  .badge-primary, .badge.bg-primary {
    background-color: var(--mk-accentedBg) !important;
    color: var(--mk-accent) !important;
  }

  .badge-success, .badge.bg-success {
    background-color: var(--mk-success) !important;
    color: #0A1F15 !important;
  }

  .badge-danger, .badge.bg-danger {
    background-color: var(--mk-error) !important;
    color: #2B0814 !important;
  }

  .badge-warning, .badge.bg-warning {
    background-color: var(--mk-warn) !important;
    color: #1A0F00 !important;
  }

  /* === ALERTS === */
  .alert-success {
    background-color: rgba(121, 255, 194, 0.15) !important;
    color: #79FFC2 !important;
    border: none !important;
    border-left: 3px solid var(--mk-success) !important;
  }

  .alert-danger {
    background-color: rgba(255, 102, 194, 0.15) !important;
    color: #FF66C2 !important;
    border: none !important;
    border-left: 3px solid var(--mk-error) !important;
  }

  .alert-warning {
    background-color: rgba(255, 175, 99, 0.15) !important;
    color: #FFAF63 !important;
    border: none !important;
    border-left: 3px solid var(--mk-warn) !important;
  }

  .alert-info {
    background-color: var(--mk-accentedBg) !important;
    color: var(--mk-accent) !important;
    border: none !important;
    border-left: 3px solid var(--mk-accent) !important;
  }

  /* === TABS === */
  .nav-tabs {
    border-bottom: 1px solid var(--mk-divider) !important;
  }

  .nav-tabs .nav-link {
    color: var(--mk-fg) !important;
    border: none !important;
  }

  .nav-tabs .nav-link:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }

  .nav-tabs .nav-link.active {
    background-color: var(--mk-accentedBg) !important;
    color: var(--mk-accent) !important;
    border: none !important;
  }

  /* === DROPDOWN === */
  .dropdown-menu {
    background-color: var(--mk-popup) !important;
    border: 1px solid var(--mk-divider) !important;
    box-shadow: 0 4px 16px var(--mk-shadow) !important;
  }

  .dropdown-item {
    color: var(--mk-fg) !important;
  }

  .dropdown-item:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }

  .dropdown-item.active {
    background-color: var(--mk-accentedBg) !important;
    color: var(--mk-accent) !important;
  }

  /* === SCOREBOARD === */
  .scoreboard-row {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
  }

  .scoreboard-row:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }

  /* === PAGINATION === */
  .page-link {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
    color: var(--mk-fg) !important;
  }

  .page-link:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }

  .page-item.active .page-link {
    background-color: var(--mk-accentedBg) !important;
    border-color: var(--mk-accent) !important;
    color: var(--mk-accent) !important;
  }

  /* === FOOTER === */
  .footer {
    background-color: var(--mk-navBg) !important;
    border-top: 1px solid var(--mk-divider) !important;
    color: var(--mk-fg) !important;
  }

  /* === CODE === */
  code, pre {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
    color: #FFAB4A !important;
  }

  /* === SCROLLBAR === */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--mk-panel);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.4);
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(59, 130, 246, 0.6);
  }

  /* === MISC === */
  hr {
    border-color: var(--mk-divider) !important;
  }

  .text-muted {
    color: rgba(194, 203, 224, 0.65) !important;
  }

  .list-group-item {
    background-color: var(--mk-panel) !important;
    border: 1px solid var(--mk-divider) !important;
    color: var(--mk-fg) !important;
  }

  .list-group-item:hover {
    background-color: var(--mk-listItemHoverBg) !important;
  }
</style>
